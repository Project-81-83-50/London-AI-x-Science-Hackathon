name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, format, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/app/requirements.txt
            analysis/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/app/requirements.txt -r analysis/requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      # Golden files are generated on the developers' machines (Windows). Float32 FFTs and BLAS give results
      # that differ across CPUs / operating systems by up to ~2e-7 relative (~4e-8 absolute near zero), so CI
      # compares at a looser tolerance than the local default (rtol 1e-9); see tests/_support.py.
      - name: Tests (without the raw SEM images)
        env:
          GOLDEN_RTOL: "1e-5"
          GOLDEN_ATOL: "5e-7"
        run: python -m pytest -m "not realdata"

  frontend:
    name: Frontend (lint, format, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
